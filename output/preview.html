<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星河口腔 - AI 视频预览</title>
  <style>
    :root {
      --accent: #d7bd7a;
      --pad: 24px;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 30%, #1b2433, #0a0d14 70%);
      color: #fff;
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }
    .stage {
      width: 360px;
      height: 640px;
      position: relative;
      overflow: hidden;
      border-radius: 18px;
      background: #0b1118;
      isolation: isolate;
      box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.04);
    }
    .photo {
      position: absolute;
      inset: -10%;
      width: 120%;
      height: 120%;
      object-fit: cover;
      transform: scale(1.06);
      transition: transform 4200ms cubic-bezier(.22,.61,.36,1), filter 600ms ease;
      filter: saturate(1.06) contrast(1.04) brightness(.94);
    }
    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(6,8,12,.72), rgba(6,8,12,.06) 30%, rgba(6,8,12,.10) 56%, rgba(6,8,12,.90)),
        radial-gradient(circle at 18% 12%, rgba(120,150,235,.16), transparent 42%);
    }
    .segs {
      position: absolute;
      top: 12px;
      left: var(--pad);
      right: var(--pad);
      z-index: 3;
      display: flex;
      gap: 4px;
    }
    .seg {
      flex: 1;
      height: 3px;
      border-radius: 3px;
      background: rgba(255,255,255,.22);
      overflow: hidden;
    }
    .seg > i {
      display: block;
      height: 100%;
      width: 0;
      background: var(--accent);
      border-radius: 3px;
    }
    .topbar {
      position: absolute;
      top: 32px;
      left: var(--pad);
      right: var(--pad);
      z-index: 3;
    }
    .brand {
      display: inline-block;
      max-width: 100%;
      padding-left: 10px;
      border-left: 4px solid var(--accent);
      font-size: 13px;
      line-height: 1.15;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 12px rgba(0,0,0,.6);
    }
    .coverTitle {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      top: 82px;
      z-index: 3;
      font-size: 26px;
      line-height: 1.16;
      font-weight: 800;
      text-shadow: 0 3px 18px rgba(0,0,0,.6);
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 700ms ease, transform 700ms ease;
    }
    .coverTitle.show { opacity: 1; transform: translateY(0); }
    .captionPanel {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: 46px;
      z-index: 3;
      display: flex;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(12,14,20,.62), rgba(8,10,16,.78));
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 50px rgba(0,0,0,.4);
      opacity: 0;
      transform: translateY(14px);
      transition: opacity 420ms ease, transform 420ms ease;
    }
    .captionPanel.show { opacity: 1; transform: translateY(0); }
    .captionPanel::before {
      content: "";
      flex: 0 0 4px;
      border-radius: 3px;
      background: var(--accent);
    }
    .caption {
      font-size: 21px;
      line-height: 1.32;
      font-weight: 700;
      text-wrap: balance;
      text-shadow: 0 2px 10px rgba(0,0,0,.5);
    }
    .meta {
      position: absolute;
      left: var(--pad);
      right: var(--pad);
      bottom: calc(46px + 4px);
      z-index: 3;
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(225,230,240,.9);
      text-shadow: 0 1px 6px rgba(0,0,0,.6);
      transform: translateY(-100%);
      padding-bottom: 8px;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="photo" id="photo" alt="">
    <div class="shade"></div>
    <div class="segs" id="segs"></div>
    <div class="topbar"><span class="brand" id="brand"></span></div>
    <div class="coverTitle" id="coverTitle"></div>
    <div class="meta"><span id="timecode"></span><span id="platformTag"></span></div>
    <div class="captionPanel" id="captionPanel"><div class="caption" id="caption"></div></div>
  </div>
  <script>
    window.VIDEO_PAYLOAD = {"plan": {"shop_name": "星河口腔", "industry": "口腔门诊", "topic": "第一次洗牙前要知道什么", "platform": "generic", "aspect_ratio": "9:16", "visual_style": "premium_luxe", "duration_seconds": 24, "cover_text": "第一次洗牙前要知道什么", "titles": ["第一次了解第一次洗牙前要知道什么，先确认这几点", "来星河口腔前，可以先把流程问清楚", "第一次洗牙前要知道什么前，建议先了解是否适合自己", "给第一次了解口腔门诊的人一点参考", "星河口腔服务流程说明"], "post_copy": "第一次洗牙前要知道什么前可以先了解流程、沟通方式和是否适合自己。重点是：洗牙前会先做基础检查和流程沟通。如有不适或疑问，建议到正规机构面诊咨询", "scenes": [{"order": 1, "asset_type": "门店/封面图", "caption": "第一次了解第一次洗牙前要知道什么，建议先把流...", "voiceover": "第一次了解第一次洗牙前要知道什么，建议先把流程和适合情况问清楚。", "effect": "slow_zoom_in", "edited": false, "start": 0, "duration": 8}, {"order": 2, "asset_type": "环境/服务图", "caption": "如果你是第一次准备洗牙、担心流程不清楚的用户...", "voiceover": "如果你是第一次准备洗牙、担心流程不清楚的用户，重点不是马上决定，而是确认检查、沟通和服务步骤。", "effect": "pan_up", "edited": false, "start": 8, "duration": 8}, {"order": 3, "asset_type": "核心卖点图", "caption": "这里会先说明：洗牙前会先做基础检查和流程沟通...", "voiceover": "这里会先说明：洗牙前会先做基础检查和流程沟通，让你知道每一步在做什么。", "effect": "cut", "edited": false, "start": 16, "duration": 8}], "subtitle_style": "premium_readable", "bgm_style": "克制、干净、轻奢感的低速背景音乐"}, "scenes": [{"order": 1, "asset_type": "门店/封面图", "caption": "第一次了解第一次洗牙前要知道什么，建议先把流...", "voiceover": "第一次了解第一次洗牙前要知道什么，建议先把流程和适合情况问清楚。", "effect": "slow_zoom_in", "edited": false, "start": 0, "duration": 8, "asset_file": "image_1.png"}, {"order": 2, "asset_type": "环境/服务图", "caption": "如果你是第一次准备洗牙、担心流程不清楚的用户...", "voiceover": "如果你是第一次准备洗牙、担心流程不清楚的用户，重点不是马上决定，而是确认检查、沟通和服务步骤。", "effect": "pan_up", "edited": false, "start": 8, "duration": 8, "asset_file": "image_2.png"}, {"order": 3, "asset_type": "核心卖点图", "caption": "这里会先说明：洗牙前会先做基础检查和流程沟通...", "voiceover": "这里会先说明：洗牙前会先做基础检查和流程沟通，让你知道每一步在做什么。", "effect": "cut", "edited": false, "start": 16, "duration": 8, "asset_file": "image_3.png"}]};
  </script>
  <script>
    const payload = window.VIDEO_PAYLOAD;
    const scenes = payload.scenes;
    const plan = payload.plan;
    const total = plan.duration_seconds;
    const photo = document.getElementById('photo');
    const brand = document.getElementById('brand');
    const coverTitle = document.getElementById('coverTitle');
    const caption = document.getElementById('caption');
    const captionPanel = document.getElementById('captionPanel');
    const timecode = document.getElementById('timecode');
    const platformTag = document.getElementById('platformTag');
    const segs = document.getElementById('segs');

    brand.textContent = plan.shop_name + ' · ' + plan.industry;
    coverTitle.textContent = plan.cover_text;
    platformTag.textContent = plan.platform;

    // 分段进度条：每个场景一段
    const bars = scenes.map(() => {
      const seg = document.createElement('div');
      seg.className = 'seg';
      const fill = document.createElement('i');
      seg.appendChild(fill);
      segs.appendChild(seg);
      return fill;
    });

    let started = performance.now();
    let active = -1;

    function pickIndex(t) {
      let idx = scenes.length - 1;
      for (let i = 0; i < scenes.length; i++) {
        if (t >= scenes[i].start && t < scenes[i].start + scenes[i].duration) { idx = i; break; }
      }
      return idx;
    }

    function render() {
      const elapsed = (performance.now() - started) / 1000;
      const t = Math.min(elapsed, total - 0.01);
      const idx = pickIndex(t);
      const scene = scenes[idx];
      if (idx !== active) {
        active = idx;
        photo.src = 'assets/' + scene.asset_file;
        // 重置再触发运镜，形成缓动 Ken Burns
        const out = String(scene.effect).includes('out');
        photo.style.transition = 'none';
        photo.style.transform = out ? 'scale(1.14) translateY(6px)' : 'scale(1.04) translateY(-4px)';
        void photo.offsetWidth;
        photo.style.transition = 'transform 4200ms cubic-bezier(.22,.61,.36,1), filter 600ms ease';
        requestAnimationFrame(() => {
          photo.style.transform = out ? 'scale(1.04) translateY(-4px)' : 'scale(1.14) translateY(6px)';
        });
        // 字幕换场动画
        caption.textContent = scene.caption;
        timecode.textContent = scene.start + '-' + (scene.start + scene.duration) + 's';
        captionPanel.classList.remove('show');
        void captionPanel.offsetWidth;
        captionPanel.classList.add('show');
        coverTitle.classList.toggle('show', idx === 0);
      }
      // 进度条逐段填充
      bars.forEach((b, i) => {
        let r = 0;
        if (i < idx) r = 1;
        else if (i === idx) r = Math.min(1, (t - scene.start) / scene.duration);
        b.style.width = (r * 100).toFixed(1) + '%';
      });
      if (elapsed < total) requestAnimationFrame(render);
      else window.__VIDEO_DONE__ = true;
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
