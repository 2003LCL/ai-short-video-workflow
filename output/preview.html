<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星河口腔 - AI 视频预览</title>
  <style>
    html, body {
      margin: 0;
      background: #111827;
      color: #fff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    .stage {
      width: 360px;
      height: 640px;
      position: relative;
      overflow: hidden;
      background: #0b1118;
      isolation: isolate;
    }
    .photo {
      position: absolute;
      inset: -18px;
      width: calc(100% + 36px);
      height: calc(100% + 36px);
      object-fit: cover;
      transform: scale(1.04);
      transition: transform 1200ms ease, filter 500ms ease;
      filter: saturate(1.08) contrast(1.04) brightness(.92);
    }
    .shade {
      position: absolute;
      inset: 0;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(8,14,22,.68), rgba(8,14,22,.10) 34%, rgba(8,14,22,.08) 58%, rgba(8,14,22,.88)),
        radial-gradient(circle at 24% 18%, rgba(86,142,255,.18), transparent 34%),
        radial-gradient(circle at 76% 72%, rgba(54,211,153,.12), transparent 30%);
    }
    .topbar {
      position: absolute;
      top: 26px;
      left: 24px;
      right: 24px;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 10px;
    }
    .brand {
      min-width: 0;
      max-width: 300px;
      padding-left: 10px;
      border-left: 4px solid #d7bd7a;
      font-size: 13px;
      line-height: 1.12;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }
    .sceneNo {
      display: none;
    }
    .coverTitle {
      position: absolute;
      left: 24px;
      right: 24px;
      top: 82px;
      z-index: 2;
      font-size: 26px;
      line-height: 1.12;
      font-weight: 800;
      letter-spacing: 0;
      text-shadow: 0 3px 16px rgba(0,0,0,.50);
    }
    .captionPanel {
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 46px;
      z-index: 2;
      padding: 16px 18px 16px;
      border-top: 1px solid rgba(255,255,255,.26);
      border-radius: 0;
      background: linear-gradient(180deg, rgba(7,8,10,.78), rgba(18,19,22,.50));
      box-shadow: 0 -18px 56px rgba(0,0,0,.25);
    }
    .caption {
      font-size: 21px;
      line-height: 1.22;
      font-weight: 700;
      letter-spacing: 0;
      text-wrap: balance;
      text-shadow: 0 2px 10px rgba(0,0,0,.42);
    }
    .meta {
      display: none;
    }
    .cta {
      display: none;
    }
    .cta strong {
      color: #fff;
      font-size: 13px;
    }
    .progressRail {
      display: none;
    }
    .progress {
      height: 100%;
      background: #f8d66d;
      width: 0;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="photo" id="photo" alt="">
    <div class="shade"></div>
    <div class="topbar">
      <div class="brand" id="brand"></div>
      <div class="sceneNo" id="sceneNo"></div>
    </div>
    <div class="coverTitle" id="coverTitle"></div>
    <div class="captionPanel">
      <div class="caption" id="caption"></div>
      <div class="meta">
        <span id="meta"></span>
        <span id="timecode"></span>
      </div>
    </div>
    <div class="cta"><strong id="ctaMain"></strong><span id="platformTag"></span></div>
    <div class="progressRail"><div class="progress" id="progress"></div></div>
  </div>
  <script>
    window.VIDEO_PAYLOAD = {"plan": {"shop_name": "星河口腔", "industry": "口腔门诊", "topic": "第一次洗牙前要知道什么", "platform": "generic", "aspect_ratio": "9:16", "visual_style": "premium_luxe", "duration_seconds": 24, "cover_text": "第一次洗牙前要知道什么", "titles": ["本地社区想了解第一次洗牙前要知道什么，先看这条", "第一次来星河口腔前，可以先看这几点", "第一次洗牙前要知道什么别急着决定，先把流程问清楚", "给第一次了解口腔门诊的人一点参考", "星河口腔服务流程简单介绍"], "post_copy": "第一次洗牙前要知道什么简单整理了一版，适合第一次了解的朋友先做参考。具体情况建议结合自身需求，到正规机构当面咨询。", "scenes": [{"order": 1, "start": 0, "duration": 8, "asset": "demo_1.png", "asset_type": "门店/封面图", "caption": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "voiceover": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "effect": "slow_zoom_in"}, {"order": 2, "start": 8, "duration": 8, "asset": "demo_2.png", "asset_type": "环境/服务图", "caption": "到星河口腔前，建议先了解环境、流程和沟通方式。", "voiceover": "到星河口腔前，建议先了解环境、流程和沟通方式。", "effect": "pan_up"}, {"order": 3, "start": 16, "duration": 8, "asset": "demo_3.png", "asset_type": "核心卖点图", "caption": "这里重点是：洗牙前会先做基础检查和流程沟通。", "voiceover": "这里重点是：洗牙前会先做基础检查和流程沟通。", "effect": "cut"}], "subtitle_style": "white_text_with_dark_shadow", "bgm_style": "clean_light"}, "scenes": [{"order": 1, "start": 0, "duration": 8, "asset": "demo_1.png", "asset_type": "门店/封面图", "caption": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "voiceover": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "effect": "slow_zoom_in", "asset_file": "image_1.png"}, {"order": 2, "start": 8, "duration": 8, "asset": "demo_2.png", "asset_type": "环境/服务图", "caption": "到星河口腔前，建议先了解环境、流程和沟通方式。", "voiceover": "到星河口腔前，建议先了解环境、流程和沟通方式。", "effect": "pan_up", "asset_file": "image_2.png"}, {"order": 3, "start": 16, "duration": 8, "asset": "demo_3.png", "asset_type": "核心卖点图", "caption": "这里重点是：洗牙前会先做基础检查和流程沟通。", "voiceover": "这里重点是：洗牙前会先做基础检查和流程沟通。", "effect": "cut", "asset_file": "image_3.png"}]};
  </script>
  <script>
    const payload = window.VIDEO_PAYLOAD;
    const scenes = payload.scenes;
    const plan = payload.plan;
    const total = plan.duration_seconds;
    const photo = document.getElementById('photo');
    const brand = document.getElementById('brand');
    const sceneNo = document.getElementById('sceneNo');
    const coverTitle = document.getElementById('coverTitle');
    const caption = document.getElementById('caption');
    const meta = document.getElementById('meta');
    const timecode = document.getElementById('timecode');
    const ctaMain = document.getElementById('ctaMain');
    const platformTag = document.getElementById('platformTag');
    const progress = document.getElementById('progress');
    let started = performance.now();
    let active = -1;
    brand.textContent = plan.shop_name + ' · ' + plan.industry;
    meta.textContent = plan.topic + ' / ' + plan.platform;
    brand.textContent = plan.shop_name + ' · ' + plan.industry;
    coverTitle.textContent = plan.cover_text;
    meta.textContent = plan.topic;
    ctaMain.textContent = '建议面诊咨询';
    platformTag.textContent = plan.platform;

    function pickScene(t) {
      let current = scenes[scenes.length - 1];
      for (const scene of scenes) {
        if (t >= scene.start && t < scene.start + scene.duration) current = scene;
      }
      return current;
    }

    function render() {
      const elapsed = (performance.now() - started) / 1000;
      const t = Math.min(elapsed, total - 0.01);
      const scene = pickScene(t);
      if (scene.order !== active) {
        active = scene.order;
        photo.src = 'assets/' + scene.asset_file;
        caption.textContent = scene.caption;
        sceneNo.textContent = String(scene.order).padStart(2, '0');
        timecode.textContent = `${scene.start}-${scene.start + scene.duration}s`;
        photo.style.transform = scene.effect.includes('out') ? 'scale(1.02) translateY(-4px)' : 'scale(1.13) translateY(5px)';
      }
      progress.style.width = ((elapsed / total) * 100).toFixed(2) + '%';
      if (elapsed < total) requestAnimationFrame(render);
      else window.__VIDEO_DONE__ = true;
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
