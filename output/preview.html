<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>星河口腔 - AI 视频预览</title>
  <style>
    html, body {
      margin: 0;
      background: #111827;
      color: #fff;
      font-family: "Microsoft YaHei", Arial, sans-serif;
    }
    .stage {
      width: 360px;
      height: 640px;
      position: relative;
      overflow: hidden;
      background: #0f172a;
    }
    .photo {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scale(1.06);
      transition: transform 1000ms ease;
      filter: saturate(1.04) contrast(1.02);
    }
    .shade {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.08) 42%, rgba(0,0,0,.72));
    }
    .brand {
      position: absolute;
      top: 28px;
      left: 24px;
      right: 24px;
      font-size: 16px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0,0,0,.35);
    }
    .caption {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 92px;
      font-size: 31px;
      line-height: 1.22;
      font-weight: 800;
      text-shadow: 0 3px 14px rgba(0,0,0,.8);
    }
    .meta {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 34px;
      font-size: 14px;
      line-height: 1.35;
      color: rgba(255,255,255,.82);
      text-shadow: 0 2px 8px rgba(0,0,0,.7);
    }
    .progress {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 5px;
      background: #38bdf8;
      width: 0;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="photo" id="photo" alt="">
    <div class="shade"></div>
    <div class="brand" id="brand"></div>
    <div class="caption" id="caption"></div>
    <div class="meta" id="meta"></div>
    <div class="progress" id="progress"></div>
  </div>
  <script>
    window.VIDEO_PAYLOAD = {"plan": {"shop_name": "星河口腔", "industry": "口腔门诊", "topic": "第一次洗牙前要知道什么", "platform": "douyin", "duration_seconds": 24, "cover_text": "第一次洗牙前要知道什么", "titles": ["本地社区想了解第一次洗牙前要知道什么，先看这条", "第一次来星河口腔前，可以先看这几点", "第一次洗牙前要知道什么别急着决定，先把流程问清楚", "给第一次了解口腔门诊的人一点参考", "星河口腔服务流程简单介绍"], "post_copy": "第一次洗牙前要知道什么简单整理了一版，适合第一次了解的朋友先做参考。具体情况建议结合自身需求，到正规机构当面咨询。", "scenes": [{"order": 1, "start": 0, "duration": 8, "asset": "demo_1.png", "asset_type": "门店/封面图", "caption": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "voiceover": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "effect": "slow_zoom_in"}, {"order": 2, "start": 8, "duration": 8, "asset": "demo_2.png", "asset_type": "环境/服务图", "caption": "到星河口腔前，建议先了解环境、流程和沟通方式。", "voiceover": "到星河口腔前，建议先了解环境、流程和沟通方式。", "effect": "pan_up"}, {"order": 3, "start": 16, "duration": 8, "asset": "demo_3.png", "asset_type": "核心卖点图", "caption": "这里重点是：洗牙前会先做基础检查和流程沟通。", "voiceover": "这里重点是：洗牙前会先做基础检查和流程沟通。", "effect": "cut"}], "subtitle_style": "white_text_with_dark_shadow", "bgm_style": "clean_light"}, "scenes": [{"order": 1, "start": 0, "duration": 8, "asset": "demo_1.png", "asset_type": "门店/封面图", "caption": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "voiceover": "本地社区想了解第一次洗牙前要知道什么，可以先看这几个点。", "effect": "slow_zoom_in", "asset_file": "image_1.png"}, {"order": 2, "start": 8, "duration": 8, "asset": "demo_2.png", "asset_type": "环境/服务图", "caption": "到星河口腔前，建议先了解环境、流程和沟通方式。", "voiceover": "到星河口腔前，建议先了解环境、流程和沟通方式。", "effect": "pan_up", "asset_file": "image_2.png"}, {"order": 3, "start": 16, "duration": 8, "asset": "demo_3.png", "asset_type": "核心卖点图", "caption": "这里重点是：洗牙前会先做基础检查和流程沟通。", "voiceover": "这里重点是：洗牙前会先做基础检查和流程沟通。", "effect": "cut", "asset_file": "image_3.png"}]};
  </script>
  <script>
    const payload = window.VIDEO_PAYLOAD;
    const scenes = payload.scenes;
    const plan = payload.plan;
    const total = plan.duration_seconds;
    const photo = document.getElementById('photo');
    const brand = document.getElementById('brand');
    const caption = document.getElementById('caption');
    const meta = document.getElementById('meta');
    const progress = document.getElementById('progress');
    let started = performance.now();
    let active = -1;
    brand.textContent = plan.shop_name + ' · ' + plan.industry;
    meta.textContent = plan.topic + ' / ' + plan.platform;

    function pickScene(t) {
      let current = scenes[scenes.length - 1];
      for (const scene of scenes) {
        if (t >= scene.start && t < scene.start + scene.duration) current = scene;
      }
      return current;
    }

    function render() {
      const elapsed = (performance.now() - started) / 1000;
      const t = Math.min(elapsed, total - 0.01);
      const scene = pickScene(t);
      if (scene.order !== active) {
        active = scene.order;
        photo.src = 'assets/' + scene.asset_file;
        caption.textContent = scene.caption;
        photo.style.transform = scene.effect.includes('out') ? 'scale(1.02)' : 'scale(1.14)';
      }
      progress.style.width = ((elapsed / total) * 100).toFixed(2) + '%';
      if (elapsed < total) requestAnimationFrame(render);
      else window.__VIDEO_DONE__ = true;
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
